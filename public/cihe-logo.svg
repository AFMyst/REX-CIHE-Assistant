<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <!-- Royal CIHE Blue Background -->
  <rect width="128" height="128" fill="#144694" rx="0" />

  <!-- Crown Elements: Top Diamond & Side Triangles -->
  <!-- Top Center Diamond -->
  <polygon points="64,19 70,26 64,33 58,26" fill="#ffffff" />
  
  <!-- Top Left Triangle -->
  <polygon points="25,19 32,29 25,29" fill="#ffffff" />
  
  <!-- Top Right Triangle -->
  <polygon points="103,19 103,29 96,29" fill="#ffffff" />

  <!-- Crown Ribbon & Struts -->
  <g fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left vertical flank -->
    <line x1="25" y1="29" x2="25" y2="70" />
    
    <!-- Right vertical flank -->
    <line x1="103" y1="29" x2="103" y2="70" />

    <!-- Center Peak to Lower Intersections -->
    <polyline points="45,54 64,32 83,54" />

    <!-- Left Peak down-angle and Right Peak down-angle -->
    <line x1="25" y1="29" x2="45" y2="54" />
    <line x1="103" y1="29" x2="83" y2="54" />

    <!-- Inner Bottom Loops & Center Sweeping Arch -->
    <!-- Left outer loop to middle: from (25, 70) curving up to (45, 54) -->
    <path d="M 25 70 C 25 64 35 57 45 54" />
    <!-- Right outer loop to middle: from (103, 70) curving up to (83, 54) -->
    <path d="M 103 70 C 103 64 93 57 83 54" />

    <!-- Smooth sweeping wave/ribbon across bottom center -->
    <path d="M 25 70 C 45 74 52 68 64 68 C 76 68 83 74 103 70" />
    <!-- Center ribbon crossing curve -->
    <path d="M 45 54 C 52 65 76 65 83 54" />
  </g>

  <!-- Typography: CIHE -->
  <text
    x="64"
    y="107"
    text-anchor="middle"
    font-family="'Inter', 'Geist', 'Arial Black', sans-serif"
    font-weight="900"
    font-size="29"
    letter-spacing="1.5"
    fill="#ffffff"
  >CIHE</text>
</svg>
